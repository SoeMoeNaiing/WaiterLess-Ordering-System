<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Restaurant</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; color: #222; }
    h1 { margin-bottom: 0.5rem; }
    .muted { color: #666; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    a { color: #0a58ca; }
  </style>
</head>
<body>
  <h1>Admin panel</h1>
  <p class="muted">Coming soon. This is iteration 4.1 — proof that static serving works.</p>

  <div class="card">
    <h2>API status</h2>
    <p id="health" class="muted">checking…</p>
  </div>

  <div class="card">
    <h2>What's next</h2>
    <ul>
      <li>Table list with QR codes</li>
      <li>Category and menu management</li>
      <li>Image uploads</li>
    </ul>
  </div>

  <script>
    fetch('/health').then(r => r.json()).then(d => {
      document.getElementById('health').textContent =
        `ok: ${d.ok}, db: ${d.db}, at ${d.time}`;
    }).catch(e => {
      document.getElementById('health').textContent = 'error: ' + e.message;
    });
  </script>
</body>
</html>
