<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Restaurant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #222;
    }
    h1 { margin: 0 0 1rem; }
    h2 { margin: 0 0 0.75rem; font-size: 1.1rem; }
    .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    .row { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 0; border-bottom: 1px solid #f0f0f0; }
    .row:last-child { border-bottom: none; }
    .row img { width: 96px; height: 96px; border: 1px solid #eee; border-radius: 4px; }
    .row .info { flex: 1; }
    .row .num { font-size: 1.1rem; font-weight: 600; }
    .row .label { color: #666; font-size: 0.9rem; }
    .row .token { color: #999; font-size: 0.75rem; font-family: monospace; }
    .badge { display: inline-block; font-size: 0.7rem; padding: 0.15rem 0.4rem; border-radius: 4px; margin-left: 0.5rem; }
    .badge.on { background: #d1f4d1; color: #155724; }
    .badge.off { background: #f4d1d1; color: #721c24; }
    button {
      font: inherit; padding: 0.4rem 0.8rem; border: 1px solid #ccc; border-radius: 6px;
      background: #fff; cursor: pointer;
    }
    button:hover { background: #f5f5f5; }
    button.primary { background: #0a58ca; color: #fff; border-color: #0a58ca; }
    button.primary:hover { background: #084cb0; }
    button.danger { color: #b02a37; border-color: #b02a37; }
    button.danger:hover { background: #fbeaec; }
    .actions { display: flex; gap: 0.5rem; }
    input[type="text"] { font: inherit; padding: 0.4rem 0.6rem; border: 1px solid #ccc; border-radius: 6px; width: 100%; }
    .form-row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
    .form-row input { flex: 1; }
    .muted { color: #888; font-size: 0.9rem; }
    .error { color: #b02a37; }

        .thumb { width: 64px; height: 64px; object-fit: cover; border: 1px solid #eee; border-radius: 4px; background: #f8f8f8; }
    select { font: inherit; padding: 0.4rem 0.6rem; border: 1px solid #ccc; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Admin panel</h1>
  <p class="muted" id="status">loading…</p>

  <div class="card">
    <h2>Add table</h2>
    <div class="form-row">
      <input id="new-table-number" type="text" placeholder="Table number (e.g. T1)" />
      <input id="new-table-label" type="text" placeholder="Label (optional)" />
      <button id="add-table" class="primary">Add</button>
    </div>
    <p id="add-error" class="error"></p>
  </div>
  <div class="card">
    <h2>Categories</h2>
    <div class="form-row">
      <input id="new-category-name" type="text" placeholder="Category name (e.g. Starters)" />
      <input id="new-category-order" type="number" placeholder="Sort order" value="0" style="max-width: 8rem;" />
      <button id="add-category" class="primary">Add</button>
    </div>
    <p id="add-category-error" class="error"></p>
    <div id="categories"><p class="muted">loading…</p></div>
  </div>
    <div class="card">
    <h2>Menu items</h2>
    <div class="form-row">
      <input id="new-item-name" type="text" placeholder="Item name" />
      <input id="new-item-price" type="number" step="0.01" min="0" placeholder="Price" style="max-width: 8rem;" />
      <select id="new-item-category" style="flex: 1;"></select>
      <button id="add-item" class="primary">Add</button>
    </div>
    <p id="add-item-error" class="error"></p>
    <div id="menu-items"><p class="muted">loading…</p></div>
  </div>
  <div class="card">
    <h2>Tables</h2>
    <div id="tables"><p class="muted">loading…</p></div>

  </div>

  <script src="/admin/app.js"></script>
</body>
</html>
