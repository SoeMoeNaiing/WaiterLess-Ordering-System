<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a58ca" />
  <title>Menu</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0; padding: 0; color: #222; background: #fafafa;
      padding-bottom: 6rem; /* leave room for the sticky cart bar later */
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: #0a58ca; color: #fff; padding: 0.75rem 1rem;
      display: flex; align-items: baseline; gap: 0.5rem;
    }
    header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
    header .table { margin-left: auto; font-size: 0.85rem; opacity: 0.9; }
    main { padding: 1rem; max-width: 640px; margin: 0 auto; }
    h2 {
      font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em;
      color: #666; margin: 1.5rem 0 0.5rem; font-weight: 600;
    }
    h2:first-child { margin-top: 0; }
    .item {
      display: flex; gap: 0.75rem; padding: 0.75rem;
      background: #fff; border-radius: 8px; margin-bottom: 0.5rem;
      border: 1px solid #eee;
    }
    .item.sold-out { opacity: 0.55; }
    .item img {
      width: 72px; height: 72px; object-fit: cover; border-radius: 6px;
      background: #f0f0f0; flex-shrink: 0;
    }
    .item .info { flex: 1; min-width: 0; }
    .item .name { font-weight: 600; margin-bottom: 0.15rem; }
    .item .desc { color: #666; font-size: 0.85rem; margin-bottom: 0.35rem; line-height: 1.3; }
    .item .price { font-weight: 600; color: #0a58ca; }
    .item .price .sold { color: #b02a37; font-weight: 500; font-size: 0.85rem; margin-left: 0.5rem; }
    .empty { text-align: center; padding: 3rem 1rem; color: #888; }
    .error {
      max-width: 640px; margin: 2rem auto; padding: 1rem;
      background: #fbeaec; color: #721c24; border-radius: 8px; text-align: center;
    }
    .loading { text-align: center; padding: 3rem 1rem; color: #888; }
  </style>
</head>
<body>
  <header>
    <h1 id="restaurant">Menu</h1>
    <span class="table" id="table-label"></span>
  </header>
  <main id="root">
    <div class="loading">loading menu…</div>
  </main>

  <script src="/customer/menu.js"></script>
</body>
</html>
