<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#0a58ca" />
  <title>Your orders</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0; padding: 0; color: #222; background: #fafafa;
      min-height: 100vh;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: #0a58ca; color: #fff; padding: 0.75rem 1rem;
      display: flex; align-items: baseline; gap: 0.5rem;
    }
    header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
    header .table { margin-left: auto; font-size: 0.85rem; opacity: 0.9; }
    main { padding: 1rem; max-width: 900px; margin: 0 auto; }

    .card {
      background: #fff; border: 1px solid #eee; border-radius: 10px;
      padding: 1.25rem; margin-bottom: 1rem;
    }

    .muted { color: #888; font-size: 0.9rem; }

    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }
    .order-card { padding: 0; overflow: hidden; display: flex; flex-direction: column; margin-bottom: 0; }
    .order-card-head {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .order-card-head.st-placed { background: #eaf1fb; color: #0a58ca; }
    .order-card-head.st-served { background: #e6f4ea; color: #198754; }
    .order-card-head.st-cancelled { background: #fbeaec; color: #b02a37; }
    .order-label { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.15rem; }
    .order-sub { font-size: 0.85rem; opacity: 0.8; }
    .order-meta {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 0.75rem 1.25rem 0;
      font-size: 0.8rem; color: #888;
    }

    .items { list-style: none; margin: 0; padding: 0.5rem 1.25rem; }
    .items li {
      display: flex; gap: 0.75rem; padding: 0.5rem 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .items li:last-child { border-bottom: none; }
    .items .qty { font-weight: 700; color: #0a58ca; min-width: 2rem; }
    .items .name { flex: 1; }
    .items .price { color: #666; font-variant-numeric: tabular-nums; }

    .total-row {
      display: flex; justify-content: space-between;
      padding: 0.75rem 1.25rem 1rem;
      border-top: 2px solid #f0f0f0; font-weight: 700; font-size: 1.1rem;
      margin-top: auto;
    }

    .order-more {
      width: 100%; padding: 0.9rem; margin-top: 0.5rem;
      background: #0a58ca; color: #fff; border: none; border-radius: 8px;
      font-weight: 600; font-size: 1rem; cursor: pointer;
    }
    .order-more:hover { background: #084cb0; }

    .error {
      max-width: 640px; margin: 2rem auto; padding: 1rem;
      background: #fbeaec; color: #721c24; border-radius: 8px; text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Your orders</h1>
    <span class="table" id="table-label"></span>
  </header>
  <main id="root">
    <div class="card muted">Loading…</div>
  </main>

  <script type="module" src="/customer/status.js?v=3"></script>
</body>
</html>
