<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#0a58ca" />
  <title>Order status</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0; padding: 0; color: #222; background: #fafafa;
      min-height: 100vh;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: #0a58ca; color: #fff; padding: 0.75rem 1rem;
      display: flex; align-items: baseline; gap: 0.5rem;
    }
    header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
    header .table { margin-left: auto; font-size: 0.85rem; opacity: 0.9; }
    main { padding: 1rem; max-width: 640px; margin: 0 auto; }

    .card {
      background: #fff; border: 1px solid #eee; border-radius: 10px;
      padding: 1.25rem; margin-bottom: 1rem;
    }

    .order-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 0.25rem;
    }
    .order-head h2 { margin: 0; font-size: 1.1rem; }
    .order-head .order-id { color: #888; font-size: 0.9rem; }
    .muted { color: #888; font-size: 0.9rem; }

    .steps {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin: 1.5rem 0 0.5rem; gap: 0.25rem;
    }
    .step { flex: 1; text-align: center; position: relative; }
    .step .dot {
      width: 28px; height: 28px; border-radius: 50%;
      background: #e5e5e5; color: #999;
      margin: 0 auto 0.5rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 700;
      border: 2px solid #e5e5e5;
      transition: all 0.25s;
    }
    .step .label {
      font-size: 0.75rem; color: #999; text-transform: uppercase;
      letter-spacing: 0.04em; font-weight: 600;
    }
    .step.done .dot { background: #198754; color: #fff; border-color: #198754; }
    .step.done .label { color: #198754; }
    .step.current .dot {
      background: #0a58ca; color: #fff; border-color: #0a58ca;
      box-shadow: 0 0 0 4px rgba(10,88,202,0.15);
    }
    .step.current .label { color: #0a58ca; }
    .step + .step::before {
      content: ''; position: absolute; top: 13px; left: -50%;
      width: 100%; height: 2px; background: #e5e5e5; z-index: -1;
    }
    .step.done + .step::before { background: #198754; }

    .cancelled {
      text-align: center; padding: 1.5rem 0.5rem;
      background: #fbeaec; color: #721c24; border-radius: 8px;
      font-weight: 600;
    }

    .items { list-style: none; margin: 0.5rem 0 0; padding: 0; }
    .items li {
      display: flex; gap: 0.75rem; padding: 0.5rem 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .items li:last-child { border-bottom: none; }
    .items .qty { font-weight: 700; color: #0a58ca; min-width: 2rem; }
    .items .name { flex: 1; }
    .items .price { color: #666; font-variant-numeric: tabular-nums; }

    .total-row {
      display: flex; justify-content: space-between;
      padding-top: 0.75rem; margin-top: 0.25rem;
      border-top: 2px solid #f0f0f0; font-weight: 700; font-size: 1.1rem;
    }

    .order-more {
      width: 100%; padding: 0.9rem; margin-top: 0.5rem;
      background: #0a58ca; color: #fff; border: none; border-radius: 8px;
      font-weight: 600; font-size: 1rem; cursor: pointer;
    }
    .order-more:hover { background: #084cb0; }

    .error {
      max-width: 640px; margin: 2rem auto; padding: 1rem;
      background: #fbeaec; color: #721c24; border-radius: 8px; text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Order status</h1>
    <span class="table" id="table-label"></span>
  </header>
  <main id="root">
    <div class="card muted">Loading…</div>
  </main>

  <script src="/customer/status.js"></script>
</body>
</html>
