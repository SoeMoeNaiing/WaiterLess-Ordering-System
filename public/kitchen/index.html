<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kitchen</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0; padding: 0; background: #1a1a1a; color: #eee;
      min-height: 100vh;
    }

    #login-view {
      max-width: 320px; margin: 5rem auto; text-align: center;
      color: #eee;
    }
    #login-view h1 { margin-bottom: 2rem; font-weight: 700; }
    #login-view p { color: #888; margin-bottom: 1rem; }
    #login-view input {
      font: inherit; width: 100%; padding: 0.75rem; font-size: 1.5rem;
      text-align: center; letter-spacing: 0.5rem;
      background: #222; border: 1px solid #444; border-radius: 6px;
      color: #fff;
    }
    #login-view button {
      font: inherit; width: 100%; margin-top: 0.75rem; padding: 0.9rem;
      background: #198754; color: #fff; border: none; border-radius: 6px;
      font-weight: 600; cursor: pointer; font-size: 1rem;
    }
    #login-view button:hover { filter: brightness(1.1); }
    #login-view .error { color: #ff6b6b; margin-top: 0.75rem; min-height: 1.2rem; }

    #app-view { display: none; }
    header {
      background: #111; padding: 0.75rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
      border-bottom: 2px solid #333;
      position: sticky; top: 0; z-index: 10;
    }
    header h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }
    header .status { margin-left: auto; font-size: 0.9rem; color: #888; }
    .logout-btn {
      background: #333; color: #ccc;
      border: none; padding: 0.4rem 0.75rem; border-radius: 6px;
      cursor: pointer; font: inherit;
    }
    .logout-btn:hover { background: #444; }

    .board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      padding: 1rem;
    }
    .empty {
      grid-column: 1 / -1; text-align: center; color: #666;
      padding: 4rem 1rem; font-size: 1.2rem;
    }
    .card {
      background: #222; border-radius: 10px; padding: 1rem;
      border-left: 6px solid #198754;
      display: flex; flex-direction: column; gap: 0.75rem;
      position: relative;
    }
    .card.age-warn { border-left-color: #ffc107; }
    .card.age-late { border-left-color: #dc3545; }
    .card-head {
      display: flex; align-items: baseline; gap: 0.75rem;
    }
    .card-head .table { font-size: 1.5rem; font-weight: 700; }
    .card-head .age { margin-left: auto; font-size: 0.85rem; color: #999; }
    .card-head .order-id { font-size: 0.8rem; color: #777; }
    .card-close {
      background: none; border: none; color: #666;
      font-size: 1.5rem; line-height: 1; cursor: pointer;
      padding: 0 0.25rem; margin-left: 0.5rem; border-radius: 4px;
    }
    .card-close:hover { color: #dc3545; background: #333; }
    .items { list-style: none; margin: 0; padding: 0; }
    .items li {
      display: flex; gap: 0.5rem; padding: 0.4rem 0;
      border-bottom: 1px solid #333;
      font-size: 1.05rem;
    }
    .items li:last-child { border-bottom: none; }
    .items .qty { font-weight: 700; color: #6cbe6c; min-width: 2rem; }
    .notes {
      font-size: 0.9rem; color: #ffc107;
      background: rgba(255,193,7,0.1); padding: 0.5rem; border-radius: 4px;
    }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: auto; }
    .btn-done {
      background: #198754; color: #fff; border: none;
      font: inherit; font-weight: 700; padding: 0.75rem;
      border-radius: 6px; cursor: pointer; width: 100%;
      font-size: 1.05rem;
    }
    .btn-done:hover { filter: brightness(1.15); }
  
    .sound-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      font-size: 1.1rem;
      padding: 0.4rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 0.5rem;
    }
    .sound-btn:hover { background: rgba(255,255,255,0.18); }
    .sound-btn.muted { opacity: 0.4; }

    @keyframes new-order-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(25,135,84,0.7); background-color: #1a2a1a; }
      50%  { box-shadow: 0 0 0 8px rgba(25,135,84,0); background-color: #2a4a2a; }
      100% { box-shadow: 0 0 0 0 rgba(25,135,84,0); background-color: #222; }
    }
    .card.row-pulse {
      animation: new-order-pulse 1s ease-out 2;
    }
    .card .new-badge {
      display: inline-block;
      background: #198754;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      margin-left: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* New item layout (overrides old .items li flex) */
    .items { list-style: none; margin: 0; padding: 0; }
    .items .item-line {
      display: block;
      padding: 0.5rem 0;
      border-bottom: 1px solid #333;
      font-size: 1.05rem;
    }
    .items .item-line:last-child { border-bottom: none; }
    .item-line .item-main {
      display: flex;
      gap: 0.5rem;
      align-items: baseline;
    }
    .item-line .qty { font-weight: 700; color: #6cbe6c; min-width: 2rem; }
    .item-line .item-name { flex: 1; }
    .item-line .item-options {
      font-size: 0.85rem;
      color: #6cbe6c;
      margin-top: 0.25rem;
      padding-left: 2.5rem;
      font-weight: 600;
    }
    .item-line .item-notes {
      font-size: 0.78rem;
      color: #ffc107;
      margin-top: 0.2rem;
      padding-left: 2.5rem;
      font-style: italic;
    }
</style>
</head>
<body>

  <!-- Login view -->
  <section id="login-view">
    <h1>Kitchen</h1>
    <p>Enter the kitchen PIN</p>
    <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" />
    <button id="pin-submit">Log in</button>
    <div id="pin-error" class="error"></div>
  </section>

  <!-- App view -->
  <section id="app-view">
    <header>
      <h1>Kitchen</h1>
      <span class="status" id="status">loading…</span>
      <button class="sound-btn" id="sound-btn" title="Toggle sound (M)">🔔</button>
      <button class="logout-btn" id="logout-btn">Log out</button>
    </header>
    <div class="board" id="board">
      <div class="empty">loading orders…</div>
    </div>
  </section>

  <script src="/kitchen/kitchen.js?v=7"></script>
</body>
</html>
